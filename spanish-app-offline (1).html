<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tu español</title>
<style>
  :root {
    --bg-a: #1B0E33; --bg-b: #4B1770;
    --card: #FFF7E8; --ink: #1B0E33;
    --accent: #FF3CAC;      /* hot pink */
    --accent2: #05FFA1;     /* neon mint */
    --accent3: #FFD23F;     /* neon yellow */
    --violet: #7B2FF7;
    --brick: #FF4D6D;
    --muted: #B6A6DE;
    --paper-line: #EFE2C6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%;
    background: radial-gradient(1200px 700px at 50% -10%, var(--bg-b), var(--bg-a));
    font-family: -apple-system, "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
    color: var(--card); }
  #app { max-width: 440px; margin: 0 auto; min-height: 100vh; padding: 22px 18px 40px; display:flex; flex-direction:column; }

  /* Top nav */
  .nav-row { display:flex; gap:6px; margin-bottom:20px; background: rgba(255,255,255,0.06); padding:5px; border-radius:16px; }
  .nav-btn { flex:1; padding:10px 4px; border-radius:12px; border:none; background:transparent; color:#D9CCEF; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  .nav-btn.active { background: linear-gradient(135deg, var(--accent), var(--violet)); color:#fff; }

  .eyebrow { font-size:11px; letter-spacing:0.16em; color: var(--accent3); font-weight:700; margin-bottom:6px; }
  h1.title { font-family: Georgia, "Times New Roman", serif; font-size:32px; font-weight:700; margin:0; }
  .streak-row { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .streak-text { font-size:14px; color:#E4D9F7; font-weight:600; }

  .passport { background: var(--card); border-radius:20px; padding:20px; color:var(--ink);
    box-shadow: 0 12px 32px rgba(0,0,0,0.35); margin:16px 0 20px; border:1px solid var(--paper-line); }
  .passport-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .passport-label { font-size:12px; color:#8A7AAE; font-weight:700; letter-spacing:0.04em; }
  .passport-num { font-family: Georgia, serif; font-size:28px; font-weight:700; margin-top:2px; }
  .passport-of { font-size:15px; color:#8A7AAE; font-weight:600; }
  .stamp-circle { width:50px; height:50px; border-radius:50%; border:2.5px dashed var(--accent); color: var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; transform:rotate(-8deg); }
  .bar-track { margin-top:14px; height:8px; border-radius:8px; background:#F0E6D2; overflow:hidden; }
  .bar-fill { height:100%; background: linear-gradient(90deg, var(--violet), var(--accent)); border-radius:8px; width:0%; transition:width .4s; }
  .legend-row { display:flex; gap:14px; margin-top:10px; flex-wrap:wrap; }
  .legend-item { display:flex; align-items:center; gap:6px; }
  .legend-dot { width:8px; height:8px; border-radius:50%; }
  .legend-label { font-size:11px; color:#8A7AAE; font-weight:600; }

  .section-label { font-size:12px; font-weight:700; color:#D9CCEF; letter-spacing:0.06em; margin-bottom:9px; }
  .chip-row { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:20px; }
  .chip { padding:7px 13px; border-radius:999px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.07);
    color:#E4D9F7; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .chip.active { background: linear-gradient(135deg, var(--accent), var(--violet)); color:#fff; border:1px solid transparent; }

  .mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .mode-card { background: rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.16); border-radius:16px;
    padding:18px 13px; text-align:left; cursor:pointer; color:var(--card); font-family:inherit; }
  .mode-icon { font-size:24px; margin-bottom:7px; }
  .mode-name { font-family: Georgia, serif; font-size:17px; font-weight:700; }
  .mode-desc { font-size:11.5px; color:#C9BBE8; margin-top:3px; }
  .footer-hint { text-align:center; font-size:11.5px; color:#9C8FC2; margin-top:22px; }

  .top-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .exit-btn { background:none; border:none; color:#D9CCEF; font-size:14px; font-weight:700; cursor:pointer; width:60px; font-family:inherit; }
  .top-bar-center { text-align:center; }
  .top-bar-label { font-size:11px; color:var(--accent3); font-weight:700; letter-spacing:0.06em; }
  .top-bar-progress { font-size:13px; color:#E4D9F7; font-weight:700; margin-top:2px; }
  .spacer60 { width:60px; }

  .card-area { perspective:1200px; display:flex; justify-content:center; margin-bottom:22px; flex:1; align-items:center; }
  .flashcard { position:relative; width:100%; max-width:320px; height:220px; transform-style:preserve-3d; transition:transform .5s; cursor:pointer; }
  .flashcard.flipped { transform:rotateY(180deg); }
  .flash-face { position:absolute; inset:0; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    backface-visibility:hidden; padding:20px; text-align:center; }
  .flash-front { background:var(--card); color:var(--ink); border:1px solid var(--paper-line); }
  .flash-back { background: linear-gradient(135deg, var(--accent3), var(--accent)); color:var(--ink); transform:rotateY(180deg); }
  .flash-word { font-family: Georgia, serif; font-size:26px; font-weight:700; }
  .flash-ja { font-size:14px; margin-top:6px; opacity:0.8; font-weight:600; }
  .tap-hint { font-size:11.5px; margin-top:9px; opacity:.65; font-weight:600; }
  .tap-prompt { text-align:center; font-size:11.5px; color:#9C8FC2; font-weight:700; letter-spacing:.04em; }
  .judge-row { display:flex; gap:11px; }
  .judge-btn { flex:1; padding:14px 0; border-radius:14px; border:none; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; }
  .judge-no { background: rgba(255,77,109,0.2); color:#FFC1CE; }
  .judge-yes { background: var(--accent2); color:#0B0518; }

  .quiz-prompt { text-align:center; margin-bottom:20px; }
  .quiz-label { font-size:13px; color:#C9BBE8; font-weight:600; margin-bottom:6px; }
  .quiz-word { font-family: Georgia, serif; font-size:28px; font-weight:700; }
  .options-grid { display:flex; flex-direction:column; gap:9px; }
  .option-btn { padding:15px 17px; border-radius:14px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.07);
    color:var(--card); font-size:15px; font-weight:600; text-align:left; cursor:pointer; font-family:inherit; }
  .option-btn.correct { background: var(--accent2); color:#0B0518; border:1px solid var(--accent2); }
  .option-btn.wrong { background: var(--brick); color:#fff; border:1px solid var(--brick); }

  .speak-btn { border:none; background: rgba(255,255,255,0.12); color:var(--card); width:36px; height:36px; border-radius:50%;
    font-size:16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .speak-row { display:flex; justify-content:center; margin-top:10px; }

  .done-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:9px; }
  .done-stamp { width:68px; height:68px; border-radius:50%; border:3px dashed var(--accent3); color:var(--accent3);
    display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; margin-bottom:6px; }
  .done-title { font-family: Georgia, serif; font-size:21px; font-weight:700; }
  .done-score { font-size:15px; color:#E4D9F7; font-weight:700; }
  .done-sub { font-size:12.5px; color:#C9BBE8; }
  .primary-btn { margin-top:12px; padding:12px 26px; border-radius:999px; border:none; background: linear-gradient(135deg, var(--accent), var(--violet));
    color:#fff; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; }
  .ghost-btn { margin-top:8px; padding:10px 22px; border-radius:999px; border:1px solid rgba(255,255,255,0.3); background:transparent;
    color:var(--card); font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; }

  .review-list { width:100%; max-width:360px; text-align:left; margin-top:14px; }
  .review-item { background: rgba(255,255,255,0.07); border-radius:14px; padding:13px 15px; margin-bottom:9px; border:1px solid rgba(255,255,255,0.14); }
  .review-q { font-weight:700; font-size:14px; color:var(--accent3); }
  .review-a { font-size:14px; margin-top:3px; }
  .review-note { font-size:12.5px; color:#C9BBE8; margin-top:5px; line-height:1.5; }

  /* Conjugation trainer */
  .conj-prompt { text-align:center; margin-bottom:14px; }
  .conj-tense { font-size:12px; color:var(--accent3); font-weight:700; letter-spacing:.04em; }
  .conj-verb { font-family: Georgia, serif; font-size:24px; font-weight:700; margin-top:4px; }
  .conj-person { font-size:16px; color:#E4D9F7; margin-top:4px; }
  .conj-input-row { display:flex; gap:8px; margin-top:18px; }
  .conj-input { flex:1; padding:14px 16px; border-radius:14px; border:2px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.08);
    color:var(--card); font-size:17px; font-family:inherit; }
  .conj-input:focus { outline:none; border-color:var(--accent); }
  .conj-submit { padding:0 20px; border-radius:14px; border:none; background: linear-gradient(135deg, var(--accent), var(--violet));
    color:#fff; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; }
  .conj-feedback { text-align:center; margin-top:16px; font-size:15px; font-weight:700; min-height:22px; }
  .conj-feedback.ok { color: var(--accent2); }
  .conj-feedback.no { color: var(--brick); }

  /* Column / News */
  .article { background: rgba(255,255,255,0.06); border-radius:18px; padding:18px; margin-bottom:14px; border:1px solid rgba(255,255,255,0.13); }
  .article-title { font-family: Georgia, serif; font-size:17px; font-weight:700; color:var(--accent3); margin-bottom:8px; }
  .article-body { font-size:14px; line-height:1.75; color:#EFE7FA; }
  .news-badge { font-size:11px; background: rgba(255,60,172,0.18); color:var(--accent); padding:6px 10px; border-radius:10px; margin-bottom:16px; line-height:1.6; }
</style>
</head>
<body>
<div id="app"></div>
<script>

  { es:"Además", en:"Besides / Also", ja:"さらに", cat:"Frases" },
  { es:"Aunque", en:"Although", ja:"〜だけれども", cat:"Frases" },
].map((w,i)=>({...w,id:i}));

const CATEGORIES = [...new Set(VOCAB.map(w=>w.cat))];
const KNOWN_THRESHOLD = 3;
const STORAGE_KEY = "spanish-app-progress-v2";

function todayStr(){ return new Date().toISOString().slice(0,10); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function stripAccents(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function norm(s){ return stripAccents((s||"").trim().toLowerCase()).replace(/[¿?¡!.,]/g,""); }

/* ---------- Audio ---------- */
let audioCtx = null;
function tone(freq, dur, type){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function playCorrect(){ tone(880,0.12,"sine"); setTimeout(()=>tone(1180,0.15,"sine"),90); }
function playWrong(){ tone(180,0.25,"sawtooth"); }
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "es-MX"; u.rate = 0.92;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Persistence ---------- */
function loadProgress(){
  let data;
  try{ const raw = localStorage.getItem(STORAGE_KEY); data = raw?JSON.parse(raw):{counts:{},streak:0,lastDate:null}; }
  catch{ data = {counts:{},streak:0,lastDate:null}; }
  const today = todayStr();
  if(data.lastDate !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().slice(0,10);
    data.streak = data.lastDate === yesterday ? data.streak+1 : 1;
    data.lastDate = today;
  }
  saveProgress(data);
  return data;
}
function saveProgress(data){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){} }
let progress = loadProgress();

function markResult(id, correct){
  const cur = progress.counts[id]||0;
  progress.counts[id] = correct ? Math.min(cur+1,KNOWN_THRESHOLD) : Math.max(cur-1,0);
  saveProgress(progress);
}
function computeStats(){
  let known=0, learning=0;
  VOCAB.forEach(w=>{ const c=progress.counts[w.id]||0; if(c>=KNOWN_THRESHOLD) known++; else if(c>0) learning++; });
  return { known, learning, unseen: VOCAB.length-known-learning, total: VOCAB.length };
}

/* ---------- Conjugation data ---------- */
const PERSONS5 = ["yo","tú","él/ella/usted","nosotros","ellos/ellas/ustedes"];
const PERSONS_IMP = ["tú","usted","nosotros","ustedes"];
const TENSE_LABELS = { presente:"現在形", indefinido:"点過去", imperfecto:"線過去", futuro:"未来形", imperativo:"命令形" };
const TENSE_NOTES = {
  presente:"現在の習慣や事実を表す形。",
  indefinido:"過去に完了した1回きりの行為を表す（点過去）。",
  imperfecto:"過去に繰り返していた習慣や、当時の状態を表す（線過去）。",

const VERBS = [

    indefinido:["estuve","estuviste","estuvo","estuvimos","estuvieron"],
    imperfecto:["estaba","estabas","estaba","estábamos","estaban"],
    futuro:["estaré","estarás","estará","estaremos","estarán"],
    imperativo:["está","esté","estemos","estén"] },
  { v:"tener", ja:"持つ", presente:["tengo","tienes","tiene","tenemos","tienen"],
    indefinido:["tuve","tuviste","tuvo","tuvimos","tuvieron"],
    imperfecto:["tenía","tenías","tenía","teníamos","tenían"],
    futuro:["tendré","tendrás","tendrá","tendremos","tendrán"],
    imperativo:["ten","tenga","tengamos","tengan"] },
  { v:"ir", ja:"行く", presente:["voy","vas","va","vamos","van"],
    indefinido:["fui","fuiste","fue","fuimos","fueron"],
    imperfecto:["iba","ibas","iba","íbamos","iban"],
    futuro:["iré","irás","irá","iremos","irán"],
    imperativo:["ve","vaya","vamos","vayan"] },
  { v:"hacer", ja:"する/作る", presente:["hago","haces","hace","hacemos","hacen"],
    indefinido:["hice","hiciste","hizo","hicimos","hicieron"],
    imperfecto:["hacía","hacías","hacía","hacíamos","hacían"],
    futuro:["haré","harás","hará","haremos","harán"],
    imperativo:["haz","haga","hagamos","hagan"] },
  { v:"poder", ja:"〜できる", presente:["puedo","puedes","puede","podemos","pueden"],
    indefinido:["pude","pudiste","pudo","pudimos","pudieron"],
    imperfecto:["podía","podías","podía","podíamos","podían"],
    futuro:["podré","podrás","podrá","podremos","podrán"],
    imperativo:["puede","pueda","podamos","puedan"] },
  { v:"querer", ja:"欲しい/したい", presente:["quiero","quieres","quiere","queremos","quieren"],
    indefinido:["quise","quisiste","quiso","quisimos","quisieron"],
    imperfecto:["quería","querías","quería","queríamos","querían"],
    futuro:["querré","querrás","querrá","querremos","querrán"],
    imperativo:["quiere","quiera","queramos","quieran"] },
];
const TENSE_KEYS = ["presente","indefinido","imperfecto","futuro","imperativo"];

/* ---------- App state ---------- */
let state = { tab:"vocab", mode:"home", activeCat:"Todos", conjTense:"Todos" };
const app = document.getElementById("app");
function el(tag,className,html){ const e=document.createElement(tag); if(className) e.className=className; if(html!==undefined) e.innerHTML=html; return e; }

function render(){
  app.innerHTML = "";
  app.appendChild(navBar());
  if(state.tab==="vocab"){
    if(state.mode==="home") renderVocabHome();
    else if(state.mode==="flash") renderFlash();
    else if(state.mode==="quiz") renderQuiz();
  } else if(state.tab==="conj"){
    renderConjugation();
  } else if(state.tab==="column"){
    renderColumn();
  } else if(state.tab==="news"){
    renderNews();
  }
}

function navBar(){
  const row = el("div","nav-row");
  [["vocab","単語"],["conj","活用"],["column","コラム"],["news","ニュース"]].forEach(([key,label])=>{
    const b = el("button","nav-btn"+(state.tab===key?" active":""), label);
    b.onclick = ()=>{ state.tab=key; state.mode="home"; flashDeck=[]; quizQuestion=null; conjQuestion=null; conjMissed=[]; render(); };
    row.appendChild(b);
  });
  return row;
}

/* ---------- Vocab Home ---------- */
function renderVocabHome(){
  const stats = computeStats();
  const pct = Math.round((stats.known/stats.total)*100);
  const header = el("div");
  header.appendChild(el("div","eyebrow","CUADERNO DE VIAJE"));
  header.appendChild(el("h1","title","Tu español"));
  const sr = el("div","streak-row");
  sr.innerHTML = `<span>🔥</span><span class="streak-text">${progress.streak} ${progress.streak===1?"día":"días"} seguidos</span>`;
  header.appendChild(sr);
  app.appendChild(header);

  const passport = el("div","passport");
  passport.innerHTML = `
    <div class="passport-top">
      <div><div class="passport-label">Sellos coleccionados</div>
      <div class="passport-num">${stats.known}<span class="passport-of"> / ${stats.total}</span></div></div>
      <div class="stamp-circle">${pct}%</div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="legend-row">
      <div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span><span class="legend-label">Aprendiendo ${stats.learning}</span></div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--muted)"></span><span class="legend-label">Por ver ${stats.unseen}</span></div>
    </div>`;

  app.appendChild(el("div","section-label","Categoría（集中練習もここから）"));

  ["Todos", ...CATEGORIES].forEach(c=>{
    const chip = el("button","chip"+(state.activeCat===c?" active":""), c);
    chip.onclick = ()=>{ state.activeCat=c; render(); };
    chipRow.appendChild(chip);
  });
  app.appendChild(chipRow);

  const modeGrid = el("div","mode-grid");
  const fc = el("button","mode-card"); fc.innerHTML = `<div class="mode-icon">🗂️</div><div class="mode-name">Tarjetas</div><div class="mode-desc">Repasa a tu ritmo</div>`;
  fc.onclick = ()=>{ state.mode="flash"; render(); };
  const qc = el("button","mode-card"); qc.innerHTML = `<div class="mode-icon">✅</div><div class="mode-name">Quiz</div><div class="mode-desc">Elige la respuesta</div>`;
  qc.onclick = ()=>{ state.mode="quiz"; render(); };
  modeGrid.appendChild(fc); modeGrid.appendChild(qc);
  app.appendChild(modeGrid);
  app.appendChild(el("div","footer-hint","Unos minutos libres · practica y sigue tu viaje"));
}

function topBar(label, progressText, onExit){
  const bar = el("div","top-bar");
  const eb = el("button","exit-btn","← Salir"); eb.onclick = onExit;
  const c = el("div","top-bar-center"); c.innerHTML = `<div class="top-bar-label">${label}</div><div class="top-bar-progress">${progressText}</div>`;
  bar.appendChild(eb); bar.appendChild(c); bar.appendChild(el("div","spacer60"));
  return bar;
}
function speakRow(text){
  const row = el("div","speak-row");
  const btn = el("button","speak-btn","🔊");
  btn.onclick = (e)=>{ e.stopPropagation(); speak(text); };
  row.appendChild(btn);
  return row;
}
function doneScreen(label, score, total){
  const wrap = el("div","done-wrap");
  wrap.innerHTML = `<div class="done-stamp">✓</div><div class="done-title">¡Sesión completa!</div>
    ${typeof score==="number" ? `<div class="done-score">${score} / ${total} correctas</div>` : ""}
    <div class="done-sub">Terminaste tu ronda de ${label}.</div>`;
  const btn = el("button","primary-btn","Volver al inicio");
  btn.onclick = ()=>{ state.mode="home"; render(); };
  wrap.appendChild(btn);
  app.appendChild(wrap);
}

/* ---------- Flashcards ---------- */
let flashDeck=[], flashIdx=0, flashFlipped=false;
function renderFlash(){
  const pool = state.activeCat==="Todos" ? VOCAB : VOCAB.filter(w=>w.cat===state.activeCat);
  if(flashDeck.length===0){ flashDeck = shuffle(pool); flashIdx=0; flashFlipped=false; }
  if(pool.length===0){ const w=el("div","done-wrap","<div class='done-title'>まだ単語がありません</div>"); const b=el("button","primary-btn","戻る"); b.onclick=()=>{state.mode="home";flashDeck=[];render();}; w.appendChild(b); app.appendChild(w); return; }
  if(flashIdx>=flashDeck.length){ doneScreen("tarjetas"); flashDeck=[]; return; }
  app.appendChild(topBar(flashDeck[flashIdx].cat, `${flashIdx+1} / ${flashDeck.length}`, ()=>{ state.mode="home"; flashDeck=[]; render(); }));
  const card = flashDeck[flashIdx];
  const cardArea = el("div","card-area");
  const fcEl = el("div","flashcard"+(flashFlipped?" flipped":""));
  const front = el("div","flash-face flash-front");
  front.innerHTML = `<div class="flash-word">${card.es}</div><div class="tap-hint">toca para ver la traducción</div>`;
  const back = el("div","flash-face flash-back");
  back.innerHTML = `<div class="flash-word">${card.en}</div><div class="flash-ja">${card.ja}</div><div class="tap-hint">${card.es}</div>`;
  fcEl.appendChild(front); fcEl.appendChild(back);
  fcEl.onclick = ()=>{ flashFlipped=!flashFlipped; render(); };
  cardArea.appendChild(fcEl); app.appendChild(cardArea);
  app.appendChild(speakRow(card.es));
  if(flashFlipped){
    const row = el("div","judge-row");
    const no = el("button","judge-btn judge-no","Aún no ✕");
    no.onclick = ()=>{ markResult(card.id,false); playWrong(); flashFlipped=false; flashIdx++; render(); };
    const yes = el("button","judge-btn judge-yes","Lo sé ✓");
    yes.onclick = ()=>{ markResult(card.id,true); playCorrect(); flashFlipped=false; flashIdx++; render(); };
    row.appendChild(no); row.appendChild(yes); app.appendChild(row);
  } else {
    app.appendChild(el("div","tap-prompt","— toca la tarjeta —"));
  }
}

/* ---------- Vocab Quiz ---------- */
let quizPool=[], quizTotal=0, quizIdx=0, quizQuestion=null, quizPicked=null, quizScore=0, quizMissed=[];
function buildQuestion(pool){
  const word = pool[Math.floor(Math.random()*pool.length)];
  const distractors = shuffle(VOCAB.filter(w=>w.id!==word.id)).slice(0,3);
  return { word, options: shuffle([word,...distractors]) };
}
function renderQuiz(){
  const pool = state.activeCat==="Todos" ? VOCAB : VOCAB.filter(w=>w.cat===state.activeCat);
  if(pool.length<4){ const w=el("div","done-wrap","<div class='done-title'>このカテゴリは単語が足りません</div>"); const b=el("button","primary-btn","戻る"); b.onclick=()=>{state.mode="home";render();}; w.appendChild(b); app.appendChild(w); return; }
  if(!quizQuestion || quizPool!==pool){ quizPool=pool; quizTotal=Math.min(10,pool.length); quizIdx=0; quizQuestion=buildQuestion(pool); quizPicked=null; quizScore=0; quizMissed=[]; }
  if(quizIdx>=quizTotal){
    doneScreen("quiz", quizScore, quizTotal);
    if(quizMissed.length){
      const rl = el("div","review-list");
      rl.appendChild(el("div","section-label","日本語で復習"));
      quizMissed.forEach(m=>{
        const item = el("div","review-item");
        item.innerHTML = `<div class="review-q">${m.es}</div><div class="review-a">${m.en} ／ ${m.ja}</div>`;
        rl.appendChild(item);
      });
      app.appendChild(rl);
    }
    quizQuestion=null; return;
  }
  app.appendChild(topBar(quizQuestion.word.cat, `${quizIdx+1} / ${quizTotal}`, ()=>{ state.mode="home"; quizQuestion=null; render(); }));
  const prompt = el("div","quiz-prompt");
  prompt.innerHTML = `<div class="quiz-label">¿Cómo se dice…?</div><div class="quiz-word">${quizQuestion.word.es}</div>`;
  app.appendChild(prompt);
  app.appendChild(speakRow(quizQuestion.word.es));
  const grid = el("div","options-grid");
  quizQuestion.options.forEach(opt=>{
    const btn = el("button","option-btn", opt.en);
    if(quizPicked!==null){ if(opt.id===quizQuestion.word.id) btn.classList.add("correct"); else if(opt.id===quizPicked) btn.classList.add("wrong"); }
    btn.onclick = ()=>{
      if(quizPicked!==null) return;
      const correct = opt.id===quizQuestion.word.id;
      quizPicked = opt.id;
      markResult(quizQuestion.word.id, correct);
      if(correct){ quizScore++; playCorrect(); } else { playWrong(); quizMissed.push(quizQuestion.word); }
      render();
      setTimeout(()=>{ quizIdx++; if(quizIdx<quizTotal){ quizQuestion=buildQuestion(pool); quizPicked=null; } render(); }, 700);
    };
    grid.appendChild(btn);
  });
  app.appendChild(grid);
}

/* ---------- Conjugation trainer ---------- */
let conjQuestion=null, conjIdx=0, conjTotal=10, conjScore=0, conjMissed=[], conjFeedback="";
function buildConjQuestion(tenseFilter){
  const tense = tenseFilter==="Todos" ? TENSE_KEYS[Math.floor(Math.random()*TENSE_KEYS.length)] : tenseFilter;
  const verb = VERBS[Math.floor(Math.random()*VERBS.length)];
  const persons = tense==="imperativo" ? PERSONS_IMP : PERSONS5;
  const pIdx = Math.floor(Math.random()*persons.length);
  return { verb, tense, personIdx:pIdx, personLabel:persons[pIdx], answer: verb[tense][pIdx] };
}
function renderConjugation(){
  const header = el("div");
  header.appendChild(el("div","eyebrow","GIMNASIO DE VERBOS"));
  header.appendChild(el("h1","title","活用トレーニング"));
  app.appendChild(header);

  app.appendChild(el("div","section-label","時制を選ぶ"));
  const chipRow = el("div","chip-row");
  ["Todos", ...TENSE_KEYS].forEach(t=>{
    const label = t==="Todos" ? "Todos" : TENSE_LABELS[t];
    const chip = el("button","chip"+(state.conjTense===t?" active":""), label);
    chip.onclick = ()=>{ state.conjTense=t; conjQuestion=null; conjIdx=0; conjScore=0; conjMissed=[]; render(); };
    chipRow.appendChild(chip);
  });
  app.appendChild(chipRow);

  if(!conjQuestion){ conjQuestion = buildConjQuestion(state.conjTense); conjIdx=0; conjScore=0; conjMissed=[]; conjFeedback=""; }

  if(conjIdx>=conjTotal){
    doneScreen2conj();
    return;
  }

  const progressLine = el("div","top-bar-progress");
  const pr = el("div"); pr.style.textAlign="center"; pr.style.marginBottom="14px";
  pr.innerHTML = `<div class="top-bar-label">${conjIdx+1} / ${conjTotal}　·　スコア ${conjScore}</div>`;
  app.appendChild(pr);

  const prompt = el("div","conj-prompt");
  prompt.innerHTML = `<div class="conj-tense">${TENSE_LABELS[conjQuestion.tense]}</div>
    <div class="conj-verb">${conjQuestion.verb.v}<span style="font-size:13px;color:#C9BBE8;"> （${conjQuestion.verb.ja}）</span></div>
    <div class="conj-person">${conjQuestion.personLabel}</div>`;
  app.appendChild(prompt);

  const row = el("div","conj-input-row");
  const input = el("input","conj-input");
  input.setAttribute("type","text"); input.setAttribute("placeholder","スペイン語で入力…"); input.setAttribute("autocapitalize","none"); input.setAttribute("autocorrect","off");
  const submit = el("button","conj-submit","確認");
  row.appendChild(input); row.appendChild(submit);
  app.appendChild(row);

  const fb = el("div","conj-feedback"); fb.id="conjfb"; fb.textContent = conjFeedback;
  app.appendChild(fb);

  function submitAnswer(){
    const val = input.value;
    if(!val) return;
    const ok = norm(val) === norm(conjQuestion.answer);
    if(ok){ conjScore++; playCorrect(); fb.textContent = "¡Correcto! ✓"; fb.className="conj-feedback ok"; }
    else{ playWrong(); fb.textContent = `正解: ${conjQuestion.answer}`; fb.className="conj-feedback no"; conjMissed.push({...conjQuestion}); }
    input.disabled = true; submit.disabled = true;
    setTimeout(()=>{ conjIdx++; if(conjIdx<conjTotal){ conjQuestion = buildConjQuestion(state.conjTense); conjFeedback=""; } render(); }, 900);
  }
  submit.onclick = submitAnswer;
  input.onkeydown = (e)=>{ if(e.key==="Enter") submitAnswer(); };

  const exitBtn = el("button","ghost-btn","中断してホームへ");
  exitBtn.style.display="block"; exitBtn.style.margin="18px auto 0";
  exitBtn.onclick = ()=>{ state.tab="vocab"; state.mode="home"; conjQuestion=null; render(); };
  app.appendChild(exitBtn);
}
function doneScreen2conj(){
  const wrap = el("div","done-wrap");
  wrap.innerHTML = `<div class="done-stamp">✓</div><div class="done-title">¡Sesión completa!</div>
    <div class="done-score">${conjScore} / ${conjTotal} correctas</div>`;
  const btn = el("button","primary-btn","もう一度");
  btn.onclick = ()=>{ conjQuestion=null; render(); };
  wrap.appendChild(btn);
  app.appendChild(wrap);
  if(conjMissed.length){
    const rl = el("div","review-list");
    rl.appendChild(el("div","section-label","日本語で復習"));
    conjMissed.forEach(m=>{
      const item = el("div","review-item");
      item.innerHTML = `<div class="review-q">${m.verb.v}（${m.personLabel}・${TENSE_LABELS[m.tense]}）</div>
        <div class="review-a">正解: ${m.answer}</div>
        <div class="review-note">${TENSE_NOTES[m.tense]}</div>`;
      rl.appendChild(item);
    });
    app.appendChild(rl);
  }
}
