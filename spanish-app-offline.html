<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tu español">
<meta name="theme-color" content="#1B0E33">
<style>
  :root {
    --bg-a: #1B0E33; --bg-b: #4B1770;
    --card: #FFF7E8; --ink: #1B0E33;
    --accent: #FF3CAC; --accent2: #05FFA1; --accent3: #FFD23F;
    --violet: #7B2FF7; --brick: #FF4D6D; --muted: #B6A6DE; --paper-line: #EFE2C6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { min-height:100%; }
  body { margin:0; padding:0; min-height:100%;
    background: radial-gradient(1400px 1000px at 50% -8%, var(--bg-b), var(--bg-a) 70%);
    background-attachment: fixed; background-size: cover;
    font-family: -apple-system, "Hiragino Sans", "Segoe UI", system-ui, sans-serif; color: var(--card); }
  #app { max-width: 440px; margin: 0 auto; min-height: 100dvh; padding: 16px 18px 22px; display:flex; flex-direction:column; }
  .nav-row { display:flex; gap:6px; margin-bottom:20px; background: rgba(255,255,255,0.06); padding:5px; border-radius:16px; }
  .nav-btn { flex:1; padding:9px 2px; border-radius:11px; border:none; background:transparent; color:#D9CCEF; font-size:10.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .nav-btn.active { background: linear-gradient(135deg, var(--accent), var(--violet)); color:#fff; }
  .subnav-row { display:flex; gap:7px; margin-bottom:16px; }
  .subnav-btn { flex:1; padding:9px 4px; border-radius:11px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:#D9CCEF; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  .subnav-btn.active { background: rgba(255,255,255,0.16); color:#fff; border-color: rgba(255,255,255,0.4); }
  .eyebrow { font-size:11px; letter-spacing:0.16em; color: var(--accent3); font-weight:700; margin-bottom:6px; }
  h1.title { font-family: Georgia, "Times New Roman", serif; font-size:30px; font-weight:700; margin:0; }
  .streak-row { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .streak-text { font-size:14px; color:#E4D9F7; font-weight:600; }
  .passport { background: var(--card); border-radius:20px; padding:20px; color:var(--ink);
    box-shadow: 0 12px 32px rgba(0,0,0,0.35); margin:16px 0 20px; border:1px solid var(--paper-line); }
  .passport-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .passport-label { font-size:12px; color:#8A7AAE; font-weight:700; letter-spacing:0.04em; }
  .passport-num { font-family: Georgia, serif; font-size:28px; font-weight:700; margin-top:2px; }
  .passport-of { font-size:15px; color:#8A7AAE; font-weight:600; }
  .stamp-circle { width:50px; height:50px; border-radius:50%; border:2.5px dashed var(--accent); color: var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; transform:rotate(-8deg); }
  .bar-track { margin-top:14px; height:8px; border-radius:8px; background:#F0E6D2; overflow:hidden; }
  .bar-fill { height:100%; background: linear-gradient(90deg, var(--violet), var(--accent)); border-radius:8px; width:0%; transition:width .4s; }

<script>
/* ---------- Vocabulary ---------- */
const VOCAB = VOCAB_DATA.map((w,i)=>({...w, id:i, nivel: w.nivel || "básico"}));

const KNOWN_THRESHOLD = 2;
const STORAGE_KEY = "spanish-app-progress-v2";

function todayStr(){ return new Date().toISOString().slice(0,10); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function stripAccents(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function norm(s){ return stripAccents((s||"").trim().toLowerCase()).replace(/[¿?¡!.,]/g,"").replace(/\s+/g," "); }

/* ---------- Audio ---------- */
let audioCtx = null;
function tone(freq, dur, type){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function playCorrect(){ tone(880,0.12,"sine"); setTimeout(()=>tone(1180,0.15,"sine"),90); }
function playWrong(){ tone(180,0.25,"sawtooth"); }
function playFanfare(){
  const notes = [523,659,784,1047];
  notes.forEach((f,i)=> setTimeout(()=>tone(f,0.22,"triangle"), i*110));
}
function playTap(){ tone(700,0.05,"square"); }
function playFlip(){ tone(500,0.06,"sine"); setTimeout(()=>tone(760,0.08,"sine"),50); }
function playSelect(){ tone(600,0.07,"triangle"); }

let selectedVoice = null;
function pickVoice(){
  try{
    const voices = window.speechSynthesis.getVoices();
    const es = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith("es"));
    selectedVoice =
      es.find(v=>/enhanced|premium|natural|neural/i.test(v.name)) ||
      es.find(v=>/mx|mexic/i.test(v.lang+" "+v.name)) ||
      es.find(v=>/es-ES|espa/i.test(v.lang+" "+v.name)) ||
      es[0] || null;
  }catch(e){}
}
if(window.speechSynthesis){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    if(!selectedVoice) pickVoice();
    const u = new SpeechSynthesisUtterance(text);
    if(selectedVoice){ u.voice = selectedVoice; u.lang = selectedVoice.lang; }
    else { u.lang = "es-MX"; }
    u.rate = 0.94; u.pitch = 1.0;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Persistence ---------- */
function loadProgress(){
  let data;
  try{ const raw = localStorage.getItem(STORAGE_KEY); data = raw?JSON.parse(raw):{counts:{},streak:0,lastDate:null}; }
  catch{ data = {counts:{},streak:0,lastDate:null}; }
  const today = todayStr();
  if(data.lastDate !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().slice(0,10);
    data.streak = data.lastDate === yesterday ? data.streak+1 : 1;
    data.lastDate = today;
  }
  saveProgress(data);
  return data;
}
function saveProgress(data){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){} }
let progress = loadProgress();
function markResult(id, correct){
  const cur = progress.counts[id]||0;
  progress.counts[id] = correct ? Math.min(cur+1,KNOWN_THRESHOLD) : Math.max(cur-1,0);
  if(!correct){ progress.wrong = progress.wrong||{}; progress.wrong[id] = (progress.wrong[id]||0)+1; }
  saveProgress(progress);
}
function vocabPool(){
  let pool = state.activeCat==="Todos" ? VOCAB : VOCAB.filter(w=>w.cat===state.activeCat);
  if(state.activeLevel!=="Todos") pool = pool.filter(w=>w.nivel===state.activeLevel);
  return pool;
}
function computeStats(){
  let known=0, learning=0;
  VOCAB.forEach(w=>{ const c=progress.counts[w.id]||0; if(c>=KNOWN_THRESHOLD) known++; else if(c>0) learning++; });
  const barPct = Math.round(((known + learning*0.5)/VOCAB.length)*100);
  return { known, learning, unseen: VOCAB.length-known-learning, total: VOCAB.length, barPct };
}
function getReviewPool(){
  progress.wrong = progress.wrong || {};
  return VOCAB.filter(w => (progress.wrong[w.id]||0) > 0 && (progress.counts[w.id]||0) < KNOWN_THRESHOLD);
}

const NUM_ONES = ["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez",
  "once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte"];
const NUM_TENS = {30:"treinta",40:"cuarenta",50:"cincuenta",60:"sesenta",70:"setenta",80:"ochenta",90:"noventa"};
const NUM_HUNDREDS = {100:"cien",200:"doscientos",300:"trescientos",400:"cuatrocientos",500:"quinientos",
  600:"seiscientos",700:"setecientos",800:"ochocientos",900:"novecientos"};
function numberToSpanish(n){
  if(n<=20) return NUM_ONES[n];
  if(n<30) return "veinti"+NUM_ONES[n-20];
  if(n<100){
    const tens = Math.floor(n/10)*10, rem = n%10;
    return rem===0 ? NUM_TENS[tens] : NUM_TENS[tens]+" y "+NUM_ONES[rem];
  }
  if(n===100) return "cien";
  if(n<1000){
    const h = Math.floor(n/100)*100, rem = n%100;
    if(rem===0) return NUM_HUNDREDS[h];
    const hWord = h===100 ? "ciento" : NUM_HUNDREDS[h];
    return hWord+" "+numberToSpanish(rem);
  }
  return String(n);
}

let flashDeck=[], flashIdx=0, flashFlipped=false, lastSpokenFlashId=null, flashFanfarePlayed=false;
function renderFlash(){
  const isReview = state.mode==="review";
  const pool = isReview ? getReviewPool() : vocabPool();
  if(flashDeck.length===0){ flashDeck = shuffle(pool); flashIdx=0; flashFlipped=false; lastSpokenFlashId=null; flashFanfarePlayed=false; }
  if(pool.length===0){
    const w=el("div","done-wrap", isReview ? "<div class='done-title'>苦手な単語はまだありません 🎉</div><div class='done-sub'>クイズやカードを続けていくとここに溜まっていきます</div>" : "<div class='done-title'>まだ単語がありません</div>");

  }
  if(flashIdx>=flashDeck.length){ if(!flashFanfarePlayed){ flashFanfarePlayed=true; playFanfare(); } doneScreen(isReview ? "repaso" : "tarjetas"); flashDeck=[]; return; }
  app.appendChild(topBar(isReview ? "苦手だけ復習" : flashDeck[flashIdx].cat, `${flashIdx+1} / ${flashDeck.length}`, ()=>{ state.mode="home"; flashDeck=[]; render(); }));

  if(lastSpokenFlashId !== card.id){ lastSpokenFlashId = card.id; setTimeout(()=>speak(card.es), 150); }
  const cardArea = el("div","card-area");
  const fcEl = el("div","flashcard"+(flashFlipped?" flipped":""));
  const front = el("div","flash-face flash-front");
  front.innerHTML = `<div class="flash-word">${card.es}</div><div class="tap-hint">toca para ver la traducción</div>`;
  const back = el("div","flash-face flash-back");
  back.innerHTML = `<div class="flash-word">${card.en}</div><div class="flash-ja">${card.ja}</div><div class="tap-hint">${card.es}</div>`;
  fcEl.appendChild(front); fcEl.appendChild(back);
  fcEl.onclick = ()=>{ playFlip(); flashFlipped=!flashFlipped; render(); };
  cardArea.appendChild(fcEl); app.appendChild(cardArea);

  if(flashFlipped){
    const row = el("div","judge-row");
    const no = el("button","judge-btn judge-no","Aún no ✕");
    no.onclick = ()=>{ markResult(card.id,false); playWrong(); flashFlipped=false; flashIdx++; render(); };
    const yes = el("button","judge-btn judge-yes","Lo sé ✓");
    yes.onclick = ()=>{ markResult(card.id,true); playCorrect(); flashFlipped=false; flashIdx++; render(); };
    row.appendChild(no); row.appendChild(yes); app.appendChild(row);
  } else {
    app.appendChild(el("div","tap-prompt","— toca la tarjeta —"));
  }
}

let quizPool=[], quizTotal=0, quizIdx=0, quizQuestion=null, quizPicked=null, quizScore=0, quizMissed=[], quizLog=[], lastSpokenQuizId=null, quizFanfarePlayed=false;
function buildQuestion(pool){
  const word = pool[Math.floor(Math.random()*pool.length)];
  const distractors = shuffle(VOCAB.filter(w=>w.id!==word.id)).slice(0,3);
  return { word, options: shuffle([word,...distractors]) };
}
function renderQuiz(){
  const pool = vocabPool();
  if(pool.length<4){ const w=el("div","done-wrap","<div class='done-title'>このカテゴリは単語が足りません</div>"); const b=el("button","primary-btn","戻る"); b.onclick=()=>{state.mode="home";render();}; w.appendChild(b); app.appendChild(w); return; }
  if(!quizQuestion || quizPool!==pool){ quizPool=pool; quizTotal=Math.min(10,pool.length); quizIdx=0; quizQuestion=buildQuestion(pool); quizPicked=null; quizScore=0; quizMissed=[]; quizLog=[]; lastSpokenQuizId=null; quizFanfarePlayed=false; }
  if(quizIdx>=quizTotal){
    if(!quizFanfarePlayed){ quizFanfarePlayed=true; playFanfare(); }
    doneScreen("quiz", quizScore, quizTotal);
    const rl = el("div","review-list");
    rl.appendChild(el("div","section-label","まとめ（全問）"));
    quizLog.forEach(log=>{
      const item = el("div","review-item");
      const mark = log.correct ? "○ 正解" : "✕ 不正解";
      const markColor = log.correct ? "var(--accent2)" : "var(--brick)";
      item.innerHTML = `<div class="review-q" style="color:${markColor};">${mark}　${log.word.es}</div>
        <div class="review-a">正解: ${log.word.en} ／ ${log.word.ja}</div>
        ${!log.correct ? `<div class="review-note">あなたの回答: ${log.pickedEn}</div>` : ""}`;
      rl.appendChild(item);
    });
    app.appendChild(rl);
    quizQuestion=null; return;
  }
  if(lastSpokenQuizId !== quizQuestion.word.id){ lastSpokenQuizId = quizQuestion.word.id; setTimeout(()=>speak(quizQuestion.word.es), 150); }
  app.appendChild(topBar(quizQuestion.word.cat, `${quizIdx+1} / ${quizTotal}`, ()=>{ state.mode="home"; quizQuestion=null; render(); }));
  const prompt = el("div","quiz-prompt");
  prompt.innerHTML = `<div class="quiz-label">¿Cómo se dice…?</div><div class="quiz-word">${quizQuestion.word.es}</div>`;
  app.appendChild(prompt);
  app.appendChild(speakRow(quizQuestion.word.es));
  const grid = el("div","options-grid");
  quizQuestion.options.forEach(opt=>{
    const btn = el("button","option-btn", opt.en);
    if(quizPicked!==null){ if(opt.id===quizQuestion.word.id) btn.classList.add("correct"); else if(opt.id===quizPicked) btn.classList.add("wrong"); }
    btn.onclick = ()=>{
      if(quizPicked!==null) return;
      const correct = opt.id===quizQuestion.word.id;
      quizPicked = opt.id;
      markResult(quizQuestion.word.id, correct);
      quizLog.push({ word:quizQuestion.word, pickedEn:opt.en, correct });
      if(correct){ quizScore++; playCorrect(); } else { playWrong(); quizMissed.push(quizQuestion.word); }
      render();
      setTimeout(()=>{ quizIdx++; if(quizIdx<quizTotal){ quizQuestion=buildQuestion(pool); quizPicked=null; } render(); }, 700);
    };
    grid.appendChild(btn);
  });
  app.appendChild(grid);
}

  app.appendChild(el("div","section-label","時制を選ぶ"));
  const chipRow = el("div","chip-row");
  ["Todos", ...TENSE_KEYS].forEach(t=>{
    const label = t==="Todos" ? "Todos" : TENSE_LABELS[t];
    const chip = el("button","chip"+(state.conjTense===t?" active":""), label);
    chip.onclick = ()=>{ playTap(); state.conjTense=t; conjQuestion=null; conjIdx=0; conjScore=0; conjMissed=[]; lastSpokenConjKey=null; conjFanfarePlayed=false; render(); };
    chipRow.appendChild(chip);
  });
  app.appendChild(chipRow);
  if(!conjQuestion){ conjQuestion = buildConjQuestion(state.conjTense); conjIdx=0; conjScore=0; conjMissed=[]; lastSpokenConjKey=null; conjFanfarePlayed=false; }
  if(conjIdx>=conjTotal){ if(!conjFanfarePlayed){ conjFanfarePlayed=true; playFanfare(); } doneScreenConj(); return; }
  const conjKey = conjQuestion.verb.v+"|"+conjQuestion.tense+"|"+conjQuestion.personIdx;
  if(lastSpokenConjKey !== conjKey){ lastSpokenConjKey = conjKey; setTimeout(()=>speak(conjQuestion.verb.v), 150); }
  const pr = el("div"); pr.style.textAlign="center"; pr.style.marginBottom="14px";
  pr.innerHTML = `<div class="top-bar-label">${conjIdx+1} / ${conjTotal}　·　スコア ${conjScore}</div>`;
  app.appendChild(pr);
  const prompt = el("div","conj-prompt");
  prompt.innerHTML = `<div class="conj-tense">${TENSE_LABELS[conjQuestion.tense]}</div>
    <div class="conj-verb">${conjQuestion.verb.v}<span style="font-size:13px;color:#C9BBE8;"> （${conjQuestion.verb.ja}）</span></div>
    <div class="conj-person">${conjQuestion.personLabel}</div>`;
  app.appendChild(prompt);
  const row = el("div","conj-input-row");
  const input = el("input","conj-input");
  input.setAttribute("type","text"); input.setAttribute("placeholder","スペイン語で入力…"); input.setAttribute("autocapitalize","none"); input.setAttribute("autocorrect","off");
  const submit = el("button","conj-submit","確認");
  row.appendChild(input); row.appendChild(submit);
  app.appendChild(row);
  const fb = el("div","conj-feedback");
  app.appendChild(fb);
  function submitAnswer(){
    const val = input.value; if(!val) return;
    const ok = norm(val) === norm(conjQuestion.answer);
    if(ok){ conjScore++; playCorrect(); fb.textContent = "¡Correcto! ✓"; fb.className="conj-feedback ok"; }
    else{ playWrong(); fb.textContent = `正解: ${conjQuestion.answer}`; fb.className="conj-feedback no"; conjMissed.push({...conjQuestion}); }
    input.disabled = true; submit.disabled = true;
    setTimeout(()=>{ conjIdx++; if(conjIdx<conjTotal){ conjQuestion = buildConjQuestion(state.conjTense); } render(); }, 900);
  }
  submit.onclick = submitAnswer;
  input.onkeydown = (e)=>{ if(e.key==="Enter") submitAnswer(); };
}

/* ---------- Example sentence fill-in-the-blank ---------- */
let exDeck=[], exIdx=0, exScore=0, exMissed=[], exFanfarePlayed=false;
function topicOf(ex){
  if(ex.verb) return "conjugacion";
  if(ex.label==="por / para" || ex.label==="en / a") return "preposicion";
  if(ex.label==="目的代名詞") return "pronombre";
  if(ex.label && ex.label.includes("再帰動詞")) return "reflexivo";
  if(ex.label==="比較級" || ex.label==="同等比較" || ex.label==="最上級") return "comparativo";
  return "otro";
}
function backToMenuBtn(){
  const b = el("button","ghost-btn","← メニューに戻る");
  b.style.marginBottom="14px";
  b.onclick = ()=>{ playTap(); state.conjSubTab=null; conjQuestion=null; exDeck=[]; numQuestion=null; render(); };
  return b;
}
function renderExamples(){
  const topic = state.exTopic || "conjugacion";
  const pool = EXAMPLES.filter(ex=>topicOf(ex)===topic);
  if(exDeck.length===0 || exDeck.every(ex=>topicOf(ex)!==topic)){ exDeck = shuffle(pool); exIdx=0; exScore=0; exMissed=[]; exFanfarePlayed=false; }
  app.appendChild(backToMenuBtn());
  if(exIdx>=exDeck.length){
    if(!exFanfarePlayed){ exFanfarePlayed=true; playFanfare(); }
    const wrap = el("div","done-wrap");
    wrap.innerHTML = `<div class="done-stamp">✓</div><div class="done-title">¡Sesión completa!</div><div class="done-score">${exScore} / ${exDeck.length} correctas</div>`;
    const btn = el("button","primary-btn","もう一度");
    btn.onclick = ()=>{ exDeck=[]; render(); };

    if(exMissed.length){

        item.innerHTML = `<div class="review-q">${m.before}${answerFor(m)}${m.after}</div><div class="review-a">${m.ja}</div><div class="review-note">${noteFor(m)}</div>`;
        rl.appendChild(item);
      });
      app.appendChild(rl);
    }
    return;
  }
  const ex = exDeck[exIdx];
  const pr = el("div"); pr.style.textAlign="center"; pr.style.marginBottom="14px";
  pr.innerHTML = `<div class="top-bar-label">${exIdx+1} / ${exDeck.length}　·　スコア ${exScore}</div>`;

  const box = el("div","sentence-box");
  box.innerHTML = `${ex.before}<span class="sentence-blank" id="exblank">＿＿＿</span>${ex.after}
    <div style="font-size:12px;color:#C9BBE8;margin-top:10px;">${labelFor(ex)}</div>`;
  app.appendChild(box);
  const row = el("div","conj-input-row"); row.style.marginTop="16px";
  const input = el("input","conj-input");
  input.setAttribute("type","text"); input.setAttribute("placeholder","空欄を埋める…"); input.setAttribute("autocapitalize","none"); input.setAttribute("autocorrect","off");
  const submit = el("button","conj-submit","確認");
  row.appendChild(input); row.appendChild(submit);
  app.appendChild(row);
  const fb = el("div","conj-feedback");
  app.appendChild(fb);
  const jaLine = el("div","sentence-ja");
  app.appendChild(jaLine);
  function submitAnswer(){
    const val = input.value; if(!val) return;
    const answer = answerFor(ex);
    const ok = norm(val) === norm(answer);
    document.getElementById("exblank").textContent = answer;
    if(ok){ exScore++; playCorrect(); fb.textContent="¡Correcto! ✓"; fb.className="conj-feedback ok"; }
    else{ playWrong(); fb.textContent=`正解: ${answer}`; fb.className="conj-feedback no"; exMissed.push(ex); }
    jaLine.textContent = ex.ja;
    input.disabled=true; submit.disabled=true;
    setTimeout(()=>{ exIdx++; render(); }, 1100);
  }
  submit.onclick = submitAnswer;
  input.onkeydown = (e)=>{ if(e.key==="Enter") submitAnswer(); };
}

/* ---------- Numbers drill ---------- */
let numQuestion=null, numIdx=0, numTotal=10, numScore=0, numMissed=[], numFanfarePlayed=false;
function buildNumQuestion(){
  const ranges = [[0,20],[21,99],[100,999]];
  const [lo,hi] = ranges[Math.floor(Math.random()*ranges.length)];
  const n = lo + Math.floor(Math.random()*(hi-lo+1));
  return { n, answer: numberToSpanish(n) };
}

let newsExpanded = {};
function renderNews(){
  const header = el("div");
  header.appendChild(el("div","eyebrow","NOTICIAS"));
  header.appendChild(el("h1","title","メキシコニュース"));
  app.appendChild(header);
  const badge = el("div","news-badge","このニュースは2026年7月28日時点のスナップショットです。オフラインで動くページのため自動更新はされません。最新情報は別途ニュースサイトでご確認ください。");
  const spacer = el("div"); spacer.style.height="14px"; app.appendChild(spacer);
  app.appendChild(badge);
  NEWS_ITEMS.forEach((n,i)=>{
    const art = el("div","article");
    const expanded = !!newsExpanded[i];
    const topRow = el("div"); topRow.style.display="flex"; topRow.style.alignItems="flex-start"; topRow.style.gap="10px";
    const bodyEl = el("div","article-body"); bodyEl.style.fontStyle="italic"; bodyEl.style.flex="1"; bodyEl.textContent = n.es;
    const speakBtn = el("button","speak-btn","🔊"); speakBtn.style.flexShrink="0";
    speakBtn.onclick = ()=> speak(n.es);
    topRow.appendChild(bodyEl); topRow.appendChild(speakBtn);
    art.appendChild(topRow);
    const btn = el("button","explain-btn", expanded ? "解説をとじる" : "解説を見る");
    btn.onclick = ()=>{ newsExpanded[i] = !newsExpanded[i]; render(); };
    art.appendChild(btn);
    if(expanded){
      const box = el("div","explain-box");
      box.innerHTML = `<div class="explain-ja">${n.ja}</div>`;
      n.notes.forEach(([w,m])=>{
        const g = el("div","glossary-item"); g.innerHTML = `<b>${w}</b> — ${m}`;
        box.appendChild(g);
      });
      art.appendChild(box);
    }
    app.appendChild(art);
  });
}

render();
</script>
