<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tu español">
<meta name="theme-color" content="#1B0E33">
<style>
  :root {
    --bg-a: #1B0E33; --bg-b: #4B1770;
    --card: #FFF7E8; --ink: #1B0E33;
    --accent: #FF3CAC; --accent2: #05FFA1; --accent3: #FFD23F;
    --violet: #7B2FF7; --brick: #FF4D6D; --muted: #B6A6DE; --paper-line: #EFE2C6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { min-height:100%;
    background: radial-gradient(1400px 1000px at 50% -8%, var(--bg-b), var(--bg-a) 70%);
    background-size: cover; }
  body { margin:0; padding:0; min-height:100%;
    background: radial-gradient(1400px 1000px at 50% -8%, var(--bg-b), var(--bg-a) 70%);
    background-size: cover;
    font-family: -apple-system, "Hiragino Sans", "Segoe UI", system-ui, sans-serif; color: var(--card); }
  #app { max-width: 440px; margin: 0 auto; min-height: 100dvh; padding: 16px 18px 22px; display:flex; flex-direction:column; }
  .nav-row { display:flex; gap:6px; margin-bottom:20px; background: rgba(255,255,255,0.06); padding:5px; border-radius:16px; }
  .nav-btn { flex:1; padding:8px 1px; border-radius:10px; border:none; background:transparent; color:#D9CCEF; font-size:9.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .nav-btn.active { background: linear-gradient(135deg, var(--accent), var(--violet)); color:#fff; }
  .subnav-row { display:flex; gap:7px; margin-bottom:16px; }
  .subnav-btn { flex:1; padding:9px 4px; border-radius:11px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:#D9CCEF; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  .subnav-btn.active { background: rgba(255,255,255,0.16); color:#fff; border-color: rgba(255,255,255,0.4); }
  .eyebrow { font-size:11px; letter-spacing:0.16em; color: var(--accent3); font-weight:700; margin-bottom:6px; }
  h1.title { font-family: Georgia, "Times New Roman", serif; font-size:30px; font-weight:700; margin:0; }
  .streak-row { display:flex; align-items:center; gap:6px; margin-top:8px; cursor:pointer; width:fit-content; }
  .streak-text { font-size:14px; color:#E4D9F7; font-weight:600; }
  .streak-hint { font-size:11px; color:#9C8FC2; margin-left:2px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:14px; }
  .cal-dow { text-align:center; font-size:10.5px; color:#9C8FC2; font-weight:700; }
  .cal-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:12.5px; color:#D9CCEF; background:rgba(255,255,255,0.05); }
  .cal-day.empty { background:transparent; }
  .cal-day.studied { background: linear-gradient(135deg, var(--accent), var(--violet)); color:#fff; font-weight:700; }
  .cal-day.today { border:2px solid var(--accent3); }
  .cal-stats-row { display:flex; gap:12px; margin-top:18px; }
  .cal-stat { flex:1; background: var(--card); border-radius:16px; padding:14px; text-align:center; color:var(--ink); }

<script>
/* ---------- Vocabulary ---------- */
const CEFR_MAP = {
  A1: ["Saludos","Números","Días","Colores","Estaciones","Meses","Familia"],
  A2: ["Frases","Comida","Cuerpo","Ropa","Casa","Clima","Animales","Transporte","Lugares","Cocina","Compras","Formas"],
  B1: ["Viajes","Verbos","Trabajo","Emociones","Educación","Deportes","Tecnología","Finanzas","Sociedad","Ciencia",
       "Frecuencia","Adjetivos","Festividades","Geografía","Música","Profesiones","Naturaleza","Herramientas","Salud"],
  B2: ["Modismos","Arte","General","Coloquial"],
};
const DICT_CATEGORY_ORDER = [...CEFR_MAP.A1, ...CEFR_MAP.A2, ...CEFR_MAP.B1, ...CEFR_MAP.B2];
function dictCategoryRank(cat){ const idx = DICT_CATEGORY_ORDER.indexOf(cat); return idx===-1 ? 999 : idx; }
const CEFR_LEVEL_ORDER = ["A1","A2","B1","B2"];
function catToCefr(cat){
  for(const level of CEFR_LEVEL_ORDER){ if(CEFR_MAP[level].includes(cat)) return level; }
  return "B1";
}
function assignCefr(w){
  const base = catToCefr(w.cat);
  if(w.nivel==="avanzado") return "B2";
  const idx = CEFR_LEVEL_ORDER.indexOf(base);
  if(w.nivel==="fácil") return CEFR_LEVEL_ORDER[Math.max(0, idx-1)];
  if(w.nivel==="muy_facil") return CEFR_LEVEL_ORDER[Math.max(0, idx-2)];
  return base;
}
const VOCAB = VOCAB_DATA.map((w,i)=>({...w, id:i, nivel: w.nivel || "básico", cefr: assignCefr(w)}));

const KNOWN_THRESHOLD = 2;
const STORAGE_KEY = "spanish-app-progress-v2";

function todayStr(){ return new Date().toISOString().slice(0,10); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function stripAccents(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function norm(s){ return stripAccents((s||"").trim().toLowerCase()).replace(/[¿?¡!.,]/g,"").replace(/\s+/g," "); }

/* ---------- Audio ---------- */
let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === "suspended"){
    audioCtx.resume().catch(()=>{});
  }
  return audioCtx;
}
function tone(freq, dur, type){
  try{
    const ctx = ensureAudioCtx();
    if(!ctx) return;
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  }catch(e){}
}
function playCorrect(){ tone(880,0.12,"sine"); setTimeout(()=>tone(1180,0.15,"sine"),90); }
function playWrong(){ tone(180,0.25,"sawtooth"); }
function playFanfare(){
  const notes = [523,659,784,1047];
  notes.forEach((f,i)=> setTimeout(()=>tone(f,0.22,"triangle"), i*110));
}
function playTap(){ tone(880,0.045,"sine"); }
function playFlip(){ tone(500,0.06,"sine"); setTimeout(()=>tone(760,0.08,"sine"),50); }
function playSelect(){ tone(600,0.07,"triangle"); }

let selectedVoice = null;
function pickVoice(){
  try{
    const voices = window.speechSynthesis.getVoices();
    const es = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith("es"));
    selectedVoice =
      es.find(v=>/enhanced|premium|natural|neural/i.test(v.name)) ||
      es.find(v=>/mx|mexic/i.test(v.lang+" "+v.name)) ||
      es.find(v=>/es-ES|espa/i.test(v.lang+" "+v.name)) ||
      es[0] || null;
  }catch(e){}
}
let selectedJaVoice = null;
function pickJaVoice(){
  try{
    const voices = window.speechSynthesis.getVoices();
    const ja = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith("ja"));
    selectedJaVoice =
      ja.find(v=>/enhanced|premium|natural|neural/i.test(v.name)) ||
      ja.find(v=>/google/i.test(v.name)) ||
      ja[0] || null;
  }catch(e){}
}
if(window.speechSynthesis){
  pickVoice();
  pickJaVoice();
  window.speechSynthesis.onvoiceschanged = ()=>{ pickVoice(); pickJaVoice(); };
}
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    if(!selectedVoice) pickVoice();
    const u = new SpeechSynthesisUtterance(text);
    if(selectedVoice){ u.voice = selectedVoice; u.lang = selectedVoice.lang; }
    else { u.lang = "es-MX"; }
    u.rate = 0.94; u.pitch = 1.0;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakSeq(text, lang, onEnd){
  try{
    if(!window.speechSynthesis){ if(onEnd) onEnd(); return; }
    const u = new SpeechSynthesisUtterance(text);
    if(lang==="es"){
      if(!selectedVoice) pickVoice();
      if(selectedVoice){ u.voice=selectedVoice; u.lang=selectedVoice.lang; } else { u.lang="es-MX"; }
      u.rate = 0.94;
      u.pitch = 1.0;
    } else {
      if(!selectedJaVoice) pickJaVoice();
      if(selectedJaVoice){ u.voice=selectedJaVoice; u.lang=selectedJaVoice.lang; } else { u.lang="ja-JP"; }
      u.rate = 0.98;
      u.pitch = 1.0;
    }
    u.onend = ()=>{ if(onEnd) onEnd(); };
    u.onerror = ()=>{ if(onEnd) onEnd(); };
    window.speechSynthesis.speak(u);
  }catch(e){ if(onEnd) onEnd(); }
}

/* ---------- Persistence ---------- */
let wakeLockSentinel = null;
async function requestWakeLock(){
  try{
    if("wakeLock" in navigator){
      wakeLockSentinel = await navigator.wakeLock.request("screen");
    }
  }catch(e){}
}
function releaseWakeLock(){
  try{ if(wakeLockSentinel){ wakeLockSentinel.release().catch(()=>{}); wakeLockSentinel = null; } }catch(e){}
}

function loadProgress(){
  let data;
  try{ const raw = localStorage.getItem(STORAGE_KEY); data = raw?JSON.parse(raw):{counts:{},streak:0,lastDate:null,history:[],flagged:{},flaggedGrammar:{},settings:{autoplay:true}}; }
  catch{ data = {counts:{},streak:0,lastDate:null,history:[],flagged:{},flaggedGrammar:{},settings:{autoplay:true}}; }
  data.history = data.history || [];
  data.flagged = data.flagged || {};
  data.flaggedGrammar = data.flaggedGrammar || {};
  data.settings = data.settings || {};
  if(typeof data.settings.autoplay !== "boolean") data.settings.autoplay = true;
  if(data.settings.navSide !== "left" && data.settings.navSide !== "right") data.settings.navSide = "right";
  const today = todayStr();
  if(data.lastDate !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().slice(0,10);
    data.streak = data.lastDate === yesterday ? data.streak+1 : 1;
    data.lastDate = today;
  }
  if(!data.history.includes(today)) data.history.push(today);
  saveProgress(data);
  return data;
}

const GRAMMAR_STAT_WINDOW = 15;
function recordGrammarStat(title, correct){
  if(!title) return;
  progress.grammarStats = progress.grammarStats || {};
  const s = progress.grammarStats[title] || {};
  if(!s.recent){
    // 旧データ（累計方式）からの移行：直近の傾向としておおよその割合で初期化する
    s.recent = [];
    if(s.total > 0){
      const seedLen = Math.min(s.total, GRAMMAR_STAT_WINDOW);
      const seedCorrect = Math.round((s.correct / s.total) * seedLen);
      for(let i=0;i<seedLen;i++) s.recent.push(i < seedCorrect);
    }
  }
  s.recent.push(correct);
  if(s.recent.length > GRAMMAR_STAT_WINDOW) s.recent.shift();
  delete s.correct; delete s.total;
  progress.grammarStats[title] = s;
  saveProgress(progress);
}
function toggleGrammarFlag(title){
  progress.flaggedGrammar = progress.flaggedGrammar || {};
  if(progress.flaggedGrammar[title]) delete progress.flaggedGrammar[title];
  else progress.flaggedGrammar[title] = true;
  saveProgress(progress);
}

function markResult(id, correct){
  const cur = progress.counts[id]||0;
  progress.counts[id] = correct ? Math.min(cur+1,KNOWN_THRESHOLD) : Math.max(cur-1,0);
  if(!correct){ progress.wrong = progress.wrong||{}; progress.wrong[id] = (progress.wrong[id]||0)+1; }
  saveProgress(progress);
}
function vocabPool(){
  return state.activeLevel==="Todos" ? VOCAB : VOCAB.filter(w=>w.cefr===state.activeLevel);

function computeStats(){
  let known=0, learning=0;
  VOCAB.forEach(w=>{ const c=progress.counts[w.id]||0; if(c>=KNOWN_THRESHOLD) known++; else if(c>0) learning++; });
  const barPct = Math.round(((known + learning*0.5)/VOCAB.length)*100);
  return { known, learning, unseen: VOCAB.length-known-learning, total: VOCAB.length, barPct };
}
function getReviewPool(){
  progress.wrong = progress.wrong || {};
  return VOCAB.filter(w => (progress.wrong[w.id]||0) > 0 && (progress.counts[w.id]||0) < KNOWN_THRESHOLD);
}
function weightForCount(c){
  if(c<=0) return 6;      // 未学習・不正解続き → 出やすい
  if(c<KNOWN_THRESHOLD) return 3; // 学習中 → 標準
  return 1;               // 覚えた → 出にくい（0にはしない、忘れ防止のため稀に出す）
}
function weightedSample(pool, size){
  const withKeys = pool.map(w=>{
    const weight = weightForCount(progress.counts[w.id]||0);
    return { w, key: Math.pow(Math.random(), 1/weight) };
  });
  withKeys.sort((a,b)=>b.key-a.key);
  return withKeys.slice(0, size).map(x=>x.w);
}

function subjImperfectoStem(verb){ return verb.indefinido[4].slice(0,-3); } // ellos形からronを除いた語幹
function subjImperfectoForms(verb){
  const stem = subjImperfectoStem(verb);
  const last = stem.slice(-1);
  const accented = { a:"á", e:"é", i:"í" }[last] || last;
  const nosotrosStem = stem.slice(0,-1) + accented;
  return [stem+"ra", stem+"ras", stem+"ra", nosotrosStem+"ramos", stem+"ran"];
}
function participleOf(verb){ return verb.perfecto[0].split(" ")[1]; }
function derivedForm(verb, tense, pIdx){
  const participle = participleOf(verb);
  if(tense==="progresivo") return findVerb("estar").presente[pIdx] + " " + GERUNDIO[verb.v];
  if(tense==="pluscuamperfecto") return HABER.imperfecto[pIdx] + " " + participle;
  if(tense==="futuro_perfecto") return HABER.futuro[pIdx] + " " + participle;
  if(tense==="condicional_perfecto") return HABER.condicional[pIdx] + " " + participle;
  if(tense==="subjuntivo_perfecto") return HABER.subjuntivo[pIdx] + " " + participle;
  if(tense==="subjuntivo_imperfecto") return subjImperfectoForms(verb)[pIdx];
  return null;
}

/* ---------- Number words (0-999) ---------- */
const NUM_ONES = ["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez",
  "once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte"];
const NUM_TENS = {30:"treinta",40:"cuarenta",50:"cincuenta",60:"sesenta",70:"setenta",80:"ochenta",90:"noventa"};
const NUM_HUNDREDS = {100:"cien",200:"doscientos",300:"trescientos",400:"cuatrocientos",500:"quinientos",
  600:"seiscientos",700:"setecientos",800:"ochocientos",900:"novecientos"};
function numberToSpanish(n){
  if(n<=20) return NUM_ONES[n];
  if(n<30){
    const special = {22:"veintidós",23:"veintitrés",26:"veintiséis"};
    return special[n] || "veinti"+NUM_ONES[n-20];
  }
  if(n<100){
    const tens = Math.floor(n/10)*10, rem = n%10;
    return rem===0 ? NUM_TENS[tens] : NUM_TENS[tens]+" y "+NUM_ONES[rem];
  }
  if(n===100) return "cien";
  if(n<1000){
    const h = Math.floor(n/100)*100, rem = n%100;
    if(rem===0) return NUM_HUNDREDS[h];
    const hWord = h===100 ? "ciento" : NUM_HUNDREDS[h];
    return hWord+" "+numberToSpanish(rem);
  }
  if(n<1000000){
    const thousands = Math.floor(n/1000), rem = n%1000;
    const thousandsWord = thousands===1 ? "mil" : numberToSpanish(thousands)+" mil";
    return rem===0 ? thousandsWord : thousandsWord+" "+numberToSpanish(rem);
  }
  if(n<10000000){
    const millions = Math.floor(n/1000000), rem = n%1000000;
    const millionsWord = millions===1 ? "un millón" : numberToSpanish(millions)+" millones";
    return rem===0 ? millionsWord : millionsWord+" "+numberToSpanish(rem);
  }
  return String(n);
}

/* ---------- Time-telling ---------- */
const HOUR_WORDS = ["","la una","las dos","las tres","las cuatro","las cinco","las seis","las siete","las ocho","las nueve","las diez","las once","las doce"];
function timeToSpanish(h, m){
  function sayHour(hour){ return (hour===1 ? "es la una" : "son "+HOUR_WORDS[hour]); }
  if(m===0) return [sayHour(h)];
  if(m===15) return [sayHour(h)+" y cuarto", sayHour(h)+" y quince"];
  if(m===30) return [sayHour(h)+" y media", sayHour(h)+" y treinta"];
  if(m===45){
    const next = h===12 ? 1 : h+1;
    return [sayHour(next)+" menos cuarto", sayHour(next)+" menos quince", sayHour(h)+" y cuarenta y cinco"];
  }
  return [sayHour(h)+" y "+numberToSpanish(m)];
}
function buildTimeQuestion(){
  const h = 1 + Math.floor(Math.random()*12);
  const minuteOptions = [0,15,30,45];
  const m = minuteOptions[Math.floor(Math.random()*minuteOptions.length)];
  const variants = timeToSpanish(h,m);
  const display = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  return { isTime:true, display, answer:variants[0], acceptable:variants };
}

/* ---------- Lazy loading of per-tab data files ---------- */
const LAZY_SCRIPTS = { conj:"drills.js", dict:"dictionary.js", grammar:"grammar.js", column:"column.js", news:"news.js", phrases:"phrases.js", faq:"faq.js" };
const LAZY_STATE = {}; // src -> "loading" | "done" | "error"
function ensureTabScript(tab){
  const src = LAZY_SCRIPTS[tab];
  if(!src) return "done";
  if(!LAZY_STATE[src]){
    LAZY_STATE[src] = "loading";
    const s = document.createElement("script");
    s.src = src;
    s.onload = ()=>{ LAZY_STATE[src] = "done"; if(src==="dictionary.js" && typeof normalizeDictionaryKeysOnce==="function") normalizeDictionaryKeysOnce(); render(); };
    s.onerror = ()=>{ LAZY_STATE[src] = "error"; render(); };
    document.head.appendChild(s);
  }
  return LAZY_STATE[src];
}
function renderLazyLoading(){
  const wrap = el("div","done-wrap");
  wrap.innerHTML = `<div class="done-stamp">…</div><div class="done-title">読み込み中…</div><div class="done-sub">初回だけ少し時間がかかります</div>`;

function playDictAutoSequence(word){
  const myGen = ++dictAutoGen;
  speakSeq(word.es, "es", ()=>{
    if(myGen!==dictAutoGen || !state.dictAutoPlaying) return;

      if(myGen!==dictAutoGen || !state.dictAutoPlaying) return;
      speakSeq(word.ja, "ja", ()=>{
        if(myGen!==dictAutoGen || !state.dictAutoPlaying) return;
        setTimeout(()=>{

  });

function grammarTitleForItem(ex, topic){

function classifyPronounRole(pron){
  const p = (pron||"").toLowerCase().trim();
  const words = p.split(/\s+/);
  if(words.length===2){
    return `間接目的語「${words[0]}」＋直接目的語「${words[1]}」`;
  }
  if(["lo","la","los","las"].includes(p)) return "直接目的語";
  if(["le","les"].includes(p)) return "間接目的語";
  if(p==="se") return "間接目的語（le/lesがseに変化）";
  if(["me","te","nos","os"].includes(p)) return "直接目的語 or 間接目的語（文脈による）";
  return null;
}

function getDictList(keepId){
  const q = normDictKey(state.dictSearch);
  let list = state.dictShuffled ? VOCAB : [...VOCAB].sort((a,b)=> dictCategoryRank(a.cat)-dictCategoryRank(b.cat));
  if(state.dictFilterMode==="flagged") list = list.filter(w => (progress.flagged||{})[w.id] || w.id===keepId);
  else if(state.dictFilterMode==="hidden") list = list.filter(w => (progress.hidden||{})[w.id] || w.id===keepId);
  else list = list.filter(w => !(progress.hidden||{})[w.id] || w.id===keepId);
  if(state.dictColloquialOnly) list = list.filter(w=>w.cat==="Coloquial" || w.id===keepId);
  if(state.dictLevelFilter && state.dictLevelFilter.length>0) list = list.filter(w=>state.dictLevelFilter.includes(w.cefr) || w.id===keepId);
  if(q){
    list = list.filter(w => normDictKey(w.es).includes(q) || normDictKey(w.ja).includes(q) || normDictKey(w.en).includes(q) || w.id===keepId);
  }
  if(state.dictShuffled && dictShuffleOrder){
    const orderIdx = {}; dictShuffleOrder.forEach((es,i)=>{ orderIdx[es]=i; });
    list = [...list].sort((a,b)=> (orderIdx[a.es]??1e9) - (orderIdx[b.es]??1e9));
  }
  return list;
}

let flashDeck=[], flashIdx=0, flashFlipped=false, lastSpokenFlashId=null, flashFanfarePlayed=false;
function renderFlash(){
  const isReview = state.mode==="review";
  const isFlagged = state.mode==="flagged";
  const pool = isReview ? getReviewPool() : isFlagged ? getFlaggedPool() : vocabPool();
  if(flashDeck.length===0){
    flashDeck = (isReview || isFlagged) ? shuffle(pool) : weightedSample(pool, Math.min(20, pool.length));
    flashIdx=0; flashFlipped=false; lastSpokenFlashId=null; flashFanfarePlayed=false;
  }
  if(pool.length===0){
    const emptyMsg = isReview ? "苦手な単語はまだありません 🎉" : isFlagged ? "⭐がついた単語はまだありません" : "まだ単語がありません";
    const emptySub = isReview ? "クイズやカードを続けていくとここに溜まっていきます" : isFlagged ? "辞書で気になる単語に⭐をつけてみてください" : "";
    const w=el("div","done-wrap", `<div class='done-title'>${emptyMsg}</div>${emptySub?`<div class='done-sub'>${emptySub}</div>`:""}`);
    const b=el("button","primary-btn","戻る"); b.onclick=()=>{state.mode="home";flashDeck=[];render();}; w.appendChild(b); app.appendChild(w); return;
  }
  if(flashIdx>=flashDeck.length){ if(!flashFanfarePlayed){ flashFanfarePlayed=true; playFanfare(); } doneScreen(isReview ? "repaso" : isFlagged ? "favoritos" : "tarjetas"); flashDeck=[]; return; }
  app.appendChild(topBar(isReview ? "苦手だけ復習" : isFlagged ? "⭐ フラグした単語" : flashDeck[flashIdx].cefr, `${flashIdx+1} / ${flashDeck.length}`, ()=>{ state.mode="home"; flashDeck=[]; render(); }));
  const card = flashDeck[flashIdx];
  if(lastSpokenFlashId !== card.id){ lastSpokenFlashId = card.id; if(progress.settings && progress.settings.autoplay) setTimeout(()=>speak(card.es), 150); }
  const cardArea = el("div","card-area");
  const fcEl = el("div","flashcard"+(flashFlipped?" flipped":""));
  const front = el("div","flash-face flash-front");
  front.innerHTML = `<div class="flash-word">${card.es}</div><div class="tap-hint">toca para ver la traducción</div>`;
  const back = el("div","flash-face flash-back");
  back.innerHTML = `<div class="flash-word">${card.en}</div><div class="flash-ja">${card.ja}</div><div class="tap-hint">${card.es}</div>`;
  fcEl.appendChild(front); fcEl.appendChild(back);
  fcEl.onclick = ()=>{ playFlip(); flashFlipped=!flashFlipped; render(); };
  cardArea.appendChild(fcEl); app.appendChild(cardArea);
  app.appendChild(speakRow(card.es));
  if(flashFlipped){
    const row = el("div","judge-row");
    const no = el("button","judge-btn judge-no","Aún no ✕");
    no.onclick = ()=>{ markResult(card.id,false); playWrong(); flashFlipped=false; flashIdx++; render(); };
    const yes = el("button","judge-btn judge-yes","Lo sé ✓");
    yes.onclick = ()=>{ markResult(card.id,true); playCorrect(); flashFlipped=false; flashIdx++; render(); };
    row.appendChild(no); row.appendChild(yes); app.appendChild(row);
  } else {
    app.appendChild(el("div","tap-prompt","— toca la tarjeta —"));
  }
}

let quizFilterKey=null, quizTotal=0, quizIdx=0, quizQuestion=null, quizPicked=null, quizScore=0, quizMissed=[], quizLog=[], lastSpokenQuizId=null, quizFanfarePlayed=false;
function buildQuestion(pool){
  const word = pool[Math.floor(Math.random()*pool.length)];
  const distractors = shuffle(VOCAB.filter(w=>w.id!==word.id)).slice(0,3);
  return { word, options: shuffle([word,...distractors]) };
}
function renderQuiz(){
  const pool = vocabPool();
  const filterKey = state.activeLevel;
  if(pool.length<4){ const w=el("div","done-wrap","<div class='done-title'>このカテゴリは単語が足りません</div>"); const b=el("button","primary-btn","戻る"); b.onclick=()=>{state.mode="home";render();}; w.appendChild(b); app.appendChild(w); return; }
  if(!quizQuestion || quizFilterKey!==filterKey){ quizFilterKey=filterKey; quizTotal=Math.min(10,pool.length); quizIdx=0; quizQuestion=buildQuestion(pool); quizPicked=null; quizScore=0; quizMissed=[]; quizLog=[]; lastSpokenQuizId=null; quizFanfarePlayed=false; }
  if(quizIdx>=quizTotal){
    if(!quizFanfarePlayed){ quizFanfarePlayed=true; playFanfare(); }
    doneScreen("quiz", quizScore, quizTotal);
    const rl = el("div","review-list");
    rl.appendChild(el("div","section-label","まとめ（全問）"));
    quizLog.forEach(log=>{
      const item = el("div","review-item");
      item.style.cursor = "pointer";
      const mark = log.correct ? "○ 正解" : "✕ 不正解";
      const markColor = log.correct ? "var(--accent2)" : "var(--brick)";
      item.innerHTML = `<div class="review-q" style="color:${markColor};">${mark}　${log.word.es} <span style="color:#9C8FC2;font-size:11px;">📖 辞書を見る ›</span></div>
        <div class="review-a">正解: ${log.word.en} ／ ${log.word.ja}</div>
        ${!log.correct ? `<div class="review-note">あなたの回答: ${log.pickedEn}</div>` : ""}`;
      item.onclick = ()=>{ playTap(); goToDictionary(log.word.es, {tab:"vocab", mode:"quiz"}); };
      rl.appendChild(item);
    });
    app.appendChild(rl);
    quizQuestion = null;
    return;
  }
  if(lastSpokenQuizId !== quizQuestion.word.id){ lastSpokenQuizId = quizQuestion.word.id; if(progress.settings && progress.settings.autoplay) setTimeout(()=>speak(quizQuestion.word.es), 150); }
  app.appendChild(topBar(quizQuestion.word.cefr, `${quizIdx+1} / ${quizTotal}`, ()=>{ state.mode="home"; quizQuestion=null; render(); }));
  const langToggleRow = el("div"); langToggleRow.style.display="flex"; langToggleRow.style.justifyContent="flex-end"; langToggleRow.style.marginBottom="8px";
  const quizLang = (progress.settings && progress.settings.quizLang) || "en";
  const langBtn = el("button","chip", quizLang==="en" ? "🇬🇧 English" : "🇯🇵 日本語");
  langBtn.onclick = ()=>{ playTap(); progress.settings = progress.settings || {}; progress.settings.quizLang = quizLang==="en" ? "ja" : "en"; saveProgress(progress); render(); };
  langToggleRow.appendChild(langBtn);
  app.appendChild(langToggleRow);
  const prompt = el("div","quiz-prompt");
  prompt.innerHTML = `<div class="quiz-label">¿Cómo se dice…?</div><div class="quiz-word">${quizQuestion.word.es}</div>`;
  app.appendChild(prompt);
  app.appendChild(speakRow(quizQuestion.word.es));
  const grid = el("div","options-grid");
  quizQuestion.options.forEach(opt=>{
    const btn = el("button","option-btn", opt[quizLang]);
    if(quizPicked!==null){ if(opt.id===quizQuestion.word.id) btn.classList.add("correct"); else if(opt.id===quizPicked) btn.classList.add("wrong"); }
    btn.onclick = ()=>{
      if(quizPicked!==null) return;
      const correct = opt.id===quizQuestion.word.id;
      quizPicked = opt.id;
      markResult(quizQuestion.word.id, correct);
      quizLog.push({ word:quizQuestion.word, pickedEn:opt[quizLang], correct });
      if(correct){ quizScore++; playCorrect(); } else { playWrong(); quizMissed.push(quizQuestion.word); }
      render();
    };
    grid.appendChild(btn);
  });
  app.appendChild(grid);
  if(quizPicked!==null){
    const nextBtn = el("button","primary-btn", quizIdx+1>=quizTotal ? "結果を見る" : "次の問題へ →");
    nextBtn.style.display="block"; nextBtn.style.margin="18px auto 0";
    nextBtn.onclick = ()=>{
      playTap();
      quizIdx++;
      if(quizIdx<quizTotal){ quizQuestion=buildQuestion(pool); quizPicked=null; }
      render();
    };
    app.appendChild(nextBtn);
  }
}

let conjQuestion=null, conjIdx=0, conjTotal=10, conjScore=0, conjMissed=[], conjLog=[], lastSpokenConjKey=null, conjFanfarePlayed=false, conjFlashFlipped=false;
function buildConjQuestion(tenseFilter){
  const tense = tenseFilter==="Todos" ? TENSE_KEYS[Math.floor(Math.random()*TENSE_KEYS.length)] : tenseFilter;
  const verbType = state.conjVerbType || "all";
  const verbPool = verbType==="regular" ? VERBS.filter(v=>v.regular) : verbType==="irregular" ? VERBS.filter(v=>!v.regular) : VERBS;
  const verb = verbPool[Math.floor(Math.random()*verbPool.length)];
  const isImp = tense==="imperativo" || tense==="imperativo_neg";
  const persons = isImp ? PERSONS_IMP : PERSONS5;
  const pIdx = Math.floor(Math.random()*persons.length);
  let answer;
  if(tense==="imperativo_neg") answer = "no "+verb.subjuntivo[SUBJ_IDX_FOR_IMP[pIdx]];
  else if(DERIVED_TENSES.includes(tense)) answer = derivedForm(verb, tense, pIdx);
  else answer = verb[tense][pIdx];
  return { verb, tense, personIdx:pIdx, personLabel:persons[pIdx], answer };
}

let exDeck=[], exIdx=0, exScore=0, exMissed=[], exFanfarePlayed=false;
function topicOf(ex){
  if(ex.topic) return ex.topic;
  if(ex.verb) return "conjugacion";
  if(ex.label==="por / para" || ex.label==="en / a") return "preposicion";
  if(ex.label==="目的代名詞") return "pronombre";
  if(ex.label==="目的代名詞（二重）") return "pronombre_doble";
  if(ex.label && ex.label.includes("再帰動詞")) return "reflexivo";
  if(ex.label==="比較級" || ex.label==="同等比較" || ex.label==="最上級") return "comparativo";
  if(ex.label==="ser / estar") return "ser_estar";
  if(ex.label==="gustar型動詞") return "gustar";
  return "otro";
}

let numQuestion=null, numIdx=0, numTotal=10, numScore=0, numMissed=[], numLog=[], numFanfarePlayed=false;
function buildNumQuestion(){
  const roll = Math.random();
  if(roll < 0.2) return buildTimeQuestion();
  const ranges = [[0,20],[21,99],[100,999],[1000,9999],[10000,99999],[100000,999999],[1000000,9999999]];
  const [lo,hi] = ranges[Math.floor(Math.random()*ranges.length)];
  const n = lo + Math.floor(Math.random()*(hi-lo+1));
  const isYearLike = n>=1000 && n<=2100 && Math.random()<0.5;
  return { n, answer: numberToSpanish(n), acceptable:[numberToSpanish(n)], isYear:isYearLike };
}

function buildLinkedPhraseLine(text, sceneIdx){
  const wrap = el("div");
  wrap.style.fontFamily="Georgia,serif"; wrap.style.fontSize="15.5px"; wrap.style.fontWeight="700"; wrap.style.lineHeight="1.5";
  const tokens = text.split(/(\s+|[.,;:!?¿¡()"/])/).filter(t=>t!=="");
  tokens.forEach(tok=>{
    const cleanWord = tok.toLowerCase().replace(/[^a-záéíóúñü]/gi,"");
    if(cleanWord.length===0){ wrap.appendChild(document.createTextNode(tok)); return; }
    const vocabMatch = VOCAB.find(w => normDictKey(w.es)===cleanWord && (w.cefr==="B1" || w.cefr==="B2"));
    if(vocabMatch){
      const span = document.createElement("span");
      span.textContent = tok;
      span.style.textDecoration="underline"; span.style.textDecorationStyle="dotted"; span.style.textDecorationColor="var(--accent3)"; span.style.cursor="pointer";
      span.onclick = ()=>{ playTap(); goToDictionary(vocabMatch.es, {tab:"phrases", phraseSceneIdx: sceneIdx}); };
      wrap.appendChild(span);
    } else {
      wrap.appendChild(document.createTextNode(tok));
    }
  });
  return wrap;
}

function getColumnWeight(title){
  progress.columnPref = progress.columnPref || {};
  return progress.columnPref[title] !== undefined ? progress.columnPref[title] : 3;
}
function rateColumn(title, liked){
  progress.columnPref = progress.columnPref || {};
  let w = getColumnWeight(title);
  w = liked ? Math.min(10, w+2) : Math.max(0.5, w-1.5);
  progress.columnPref[title] = w;
  saveProgress(progress);
}
function weightedColumnSample(pool){
  const withKeys = pool.map(a=>{
    const weight = getColumnWeight(a.title);
    return { a, key: Math.pow(Math.random(), 1/weight) };
  });
  withKeys.sort((x,y)=>y.key-x.key);
  return withKeys.map(x=>x.a);
}
let columnDeck = [], columnIdx = 0;
function buildSwipeCard(article, onSwipe){
  const card = el("div","swipe-card");
  const titleBar = el("div","swipe-card-title", article.title);
  const bodyBox = el("div","swipe-card-body"); bodyBox.textContent = article.body;
  card.appendChild(titleBar); card.appendChild(bodyBox);
  let startX=0, startY=0, curX=0, dragging=false, decided=false, isHorizontal=false;
  function onDown(x,y){ dragging=true; decided=false; isHorizontal=false; startX=x; startY=y; curX=0; card.style.transition="none"; }
  function onMove(x,y,e){
    if(!dragging) return;
    const dx = x-startX, dy = y-startY;
    if(!decided){
      if(Math.abs(dx)<10 && Math.abs(dy)<10) return;
      decided = true;
      isHorizontal = Math.abs(dx) > Math.abs(dy);
    }
    if(!isHorizontal) return;
    if(e && e.cancelable) e.preventDefault();
    curX = dx;
    card.style.transform = `translateX(${curX}px) rotate(${curX/20}deg)`;
  }
  function onUp(){
    if(!dragging) return;
    dragging=false;
    if(isHorizontal){
      card.style.transition = "transform 0.3s ease";
      if(curX > 90){
        card.style.transform = `translateX(700px) rotate(25deg)`;
        setTimeout(()=> onSwipe(true), 220);
      } else if(curX < -90){
        card.style.transform = `translateX(-700px) rotate(-25deg)`;
        setTimeout(()=> onSwipe(false), 220);
      } else {
        card.style.transform = "translateX(0) rotate(0)";
      }
    }
    curX=0; decided=false; isHorizontal=false;
  }
  [titleBar, bodyBox].forEach(area=>{
    area.addEventListener("pointerdown", (e)=>{ onDown(e.clientX, e.clientY); try{ area.setPointerCapture(e.pointerId); }catch(err){} });
    area.addEventListener("pointermove", (e)=> onMove(e.clientX, e.clientY, e));
    area.addEventListener("pointerup", onUp);
    area.addEventListener("pointercancel", onUp);
  });
  return card;
}
